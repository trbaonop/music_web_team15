<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="./css/dangnghap.css">
</head>
<body>
  <!-- Form đăng nhập -->
  <div class="login-container">
    <div class="login-header">
      
    </div>
    <div class="login-body">
      <h2>WELCOME!</h2>

      <!-- FORM ĐĂNG NHẬP -->
      <form id="login-form">
        <!-- Username -->
        
<div class="input-group">
  <i class="fa-regular fa-user"></i>
  <input type="text" id="login-username-email" placeholder="Username or Email" required>

  <small class="error-message" id="email-error"></small>
</div>

<!-- Password -->
<div class="input-group">
  <i class="fa-solid fa-lock"></i>
  <input type="password" id="login-password" placeholder="Password" required>
  <i class="fa-regular fa-eye eye" id="togglePw"></i>
  <small class="error-message" id="password-error"></small>
</div>


        <!-- Options -->
        <div class="options">
          <label>
            <input type="checkbox" id="remember"> Remember me
          </label>
          <a href="#" id="forgot-link">Forgot password?</a>
        </div>

        <!-- Button -->
        <button type="submit" class="login-btn">LOGIN</button>

        <!-- Link đăng ký -->
        <p class="signup-text">
          Don't have an account?
          <a href="#" id="show-register">Create account</a>
        </p>
      </form>

      <!-- FORM ĐĂNG KÝ -->
      <form id="register-form" class="hidden">
        <div class="input-group">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="register-name" placeholder="Full name" required>
        </div>
        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="register-email" placeholder="Email" required>
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="register-password" placeholder="Password" required>
        </div>
        <button type="submit" class="login-btn">SIGN UP</button>
        <p class="signup-text">
          Already have an account?
          <a href="#" id="show-login">Login here</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Popup Forgot Password -->
  <div id="forgot-popup" class="popup">
    <div class="popup-content">
      <h3>Forgot Password</h3>
      <p>Enter your email to reset password:</p>
      <input type="email" id="reset-email" placeholder="Your email" required>
      <div class="popup-buttons">
        <button id="send-reset">Send</button>
        <button id="close-popup">Cancel</button>
      </div>
    </div>
  </div>

  <script src="./js/dangnhap.js" defer></script>
</body>
</html>
